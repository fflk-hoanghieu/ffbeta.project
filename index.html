<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO PROJECT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, #e3f2fd 40%, #bbdefb 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== LOGIN SCREEN ========== */
        #loginScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-box {
            background: #fff;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(21, 101, 192, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .login-box h2 {
            color: #0d47a1;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .login-box p {
            color: #607d8b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .login-box input:focus {
            border-color: #1976d2;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #0d47a1;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        /* ========== HEADER ========== */
        header {
            display: none; /* ẩn cho đến khi đăng nhập */
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pro-badge {
            width: 42px;
            height: 42px;
            border: 2px solid #9e9e9e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            color: #1565c0;
            background: #fff;
        }

        .project-text {
            font-size: 20px;
            font-weight: 700;
            color: #0d47a1;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Role Badge (Free / Admin / Only Admin) */
        .role-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            border: 1.5px solid;
            display: none;
        }

        .role-free {
            color: #757575;
            border-color: #bdbdbd;
            background: #f5f5f5;
        }

        .role-admin {
            color: #d32f2f;
            border-color: #ef9a9a;
            background: #ffebee;
        }

        .role-onlyadmin {
            color: #c62828;
            border-color: #e57373;
            background: #ffcdd2;
        }

        /* Hamburger */
        .menu-wrapper {
            position: relative;
        }

        .hamburger {
            width: 42px;
            height: 42px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            border-radius: 8px;
        }

        .hamburger:hover {
            background: rgba(21, 101, 192, 0.1);
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 3px;
            background: #1565c0;
            border-radius: 3px;
        }

        .dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            min-width: 200px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.25s ease;
            z-index: 1001;
        }

        .dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown button {
            width: 100%;
            padding: 14px 20px;
            border: none;
            background: none;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            color: #1565c0;
            cursor: pointer;
        }

        .dropdown button:hover {
            background: #e3f2fd;
        }

        .dropdown button:not(:last-child) {
            border-bottom: 1px solid #e0e0e0;
        }

        .dropdown .logout-btn {
            color: #d32f2f !important;
        }

        /* ========== MAIN CONTENT ========== */
        #mainContent {
            display: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 40px;
        }

        .welcome h1 {
            font-size: 28px;
            color: #0d47a1;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #546e7a;
            font-size: 16px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(21, 101, 192, 0.12);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #1976d2, #42a5f5);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(21, 101, 192, 0.2);
            border-color: #90caf9;
        }

        .card h2 {
            font-size: 26px;
            color: #0d47a1;
            margin-bottom: 12px;
        }

        .card p {
            color: #607d8b;
            font-size: 15px;
        }

        .card .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        #content-frame {
            display: none;
            width: 100%;
            height: calc(100vh - 80px);
            border: none;
            background: #fff;
        }

        .back-btn {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(21, 101, 192, 0.4);
            z-index: 999;
        }

        .back-btn:hover {
            background: #0d47a1;
        }

        @media (max-width: 600px) {
            .welcome h1 { font-size: 22px; }
            .card { padding: 30px 20px; }
            .card h2 { font-size: 22px; }
            .role-badge { font-size: 12px; padding: 5px 10px; }
        }
    </style>
</head>
<body>

    <!-- ========== MÀN HÌNH ĐĂNG NHẬP ========== -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>PRO PROJECT</h2>
            <p>Vui lòng đăng nhập để tiếp tục</p>
            <input type="text" id="username" placeholder="Tài khoản" autocomplete="off">
            <input type="password" id="password" placeholder="Mật khẩu">
            <button onclick="handleLogin()">Đăng nhập</button>
            <div class="error-msg" id="errorMsg">Sai tài khoản hoặc mật khẩu!</div>
        </div>
    </div>

    <!-- ========== HEADER ========== -->
    <header id="mainHeader">
        <div class="logo-area">
            <div class="pro-badge">PRO</div>
            <div class="project-text">PROJECT</div>
        </div>

        <div class="header-right">
            <!-- Ô hiển thị cấp bậc (Free / Admin / Only Admin) -->
            <div class="role-badge" id="roleBadge"></div>

            <div class="menu-wrapper">
                <button class="hamburger" id="hamburgerBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="dropdown" id="dropdownMenu">
                    <button onclick="loadPage('https://dash.unlockffbeta.com/', 'Penal Astutech')">Penal Astutech</button>
                    <button onclick="loadPage('https://ffkipas.my.id/penal/', 'Penal Kipas')">Penal Kipas</button>
                    <button class="logout-btn" onclick="logout()">Đăng xuất</button>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== NỘI DUNG CHÍNH ========== -->
    <div id="mainContent">
        <div class="container" id="homePage">
            <div class="welcome">
                <h1>Chọn nền tảng</h1>
                <p>Nhấn vào một trong hai ô bên dưới để tiếp tục</p>
            </div>
            <div class="cards">
                <div class="card" onclick="loadPage('https://unlockffbeta.com/', 'Astutech')">
                    <div class="icon">🚀</div>
                    <h2>Astutech</h2>
                    <p>Truy cập vào Astutech</p>
                </div>
                <div class="card" onclick="loadPage('https://ffkipas.my.id', 'Kipas')">
                    <div class="icon">🌀</div>
                    <h2>Kipas</h2>
                    <p>Truy cập vào Kipas</p>
                </div>
            </div>
        </div>

        <iframe id="content-frame" src="" allowfullscreen></iframe>
        <button class="back-btn" id="backBtn" onclick="goHome()">← Quay lại</button>
    </div>

    <script>
        // ===================== DANH SÁCH TÀI KHOẢN =====================
        const accounts = [
            // ===== FREE (không giới hạn thiết bị) =====
            { user: "free01", pass: "free01", role: "free" },
            { user: "free02", pass: "free02", role: "free" },
            { user: "free03", pass: "free03", role: "free" },
            { user: "free04", pass: "free04", role: "free" },
            { user: "free05", pass: "free05", role: "free" },
            { user: "free06", pass: "free06", role: "free" },
            { user: "free07", pass: "free07", role: "free" },
            { user: "free08", pass: "free08", role: "free" },
            { user: "free09", pass: "free09", role: "free" },
            { user: "free10", pass: "free10", role: "free" },

            // ===== ADMIN (30 tài khoản - giới hạn 1 thiết bị) =====
            { user: "admin01", pass: "admin01", role: "admin" },
            { user: "admin02", pass: "admin02", role: "admin" },
            { user: "admin03", pass: "admin03", role: "admin" },
            { user: "admin04", pass: "admin04", role: "admin" },
            { user: "admin05", pass: "admin05", role: "admin" },
            { user: "admin06", pass: "admin06", role: "admin" },
            { user: "admin07", pass: "admin07", role: "admin" },
            { user: "admin08", pass: "admin08", role: "admin" },
            { user: "admin09", pass: "admin09", role: "admin" },
            { user: "admin10", pass: "admin10", role: "admin" },
            { user: "admin11", pass: "admin11", role: "admin" },
            { user: "admin12", pass: "admin12", role: "admin" },
            { user: "admin13", pass: "admin13", role: "admin" },
            { user: "admin14", pass: "admin14", role: "admin" },
            { user: "admin15", pass: "admin15", role: "admin" },
            { user: "admin16", pass: "admin16", role: "admin" },
            { user: "admin17", pass: "admin17", role: "admin" },
            { user: "admin18", pass: "admin18", role: "admin" },
            { user: "admin19", pass: "admin19", role: "admin" },
            { user: "admin20", pass: "admin20", role: "admin" },
            { user: "admin21", pass: "admin21", role: "admin" },
            { user: "admin22", pass: "admin22", role: "admin" },
            { user: "admin23", pass: "admin23", role: "admin" },
            { user: "admin24", pass: "admin24", role: "admin" },
            { user: "admin25", pass: "admin25", role: "admin" },
            { user: "admin26", pass: "admin26", role: "admin" },
            { user: "admin27", pass: "admin27", role: "admin" },
            { user: "admin28", pass: "admin28", role: "admin" },
            { user: "admin29", pass: "admin29", role: "admin" },
            { user: "admin30", pass: "admin30", role: "admin" },

            // ===== ONLY ADMIN (5 tài khoản - giới hạn 1 thiết bị) =====
            { user: "onlyadmin1", pass: "onlyadmin1", role: "onlyadmin" },
            { user: "onlyadmin2", pass: "onlyadmin2", role: "onlyadmin" },
            { user: "onlyadmin3", pass: "onlyadmin3", role: "onlyadmin" },
            { user: "onlyadmin4", pass: "onlyadmin4", role: "onlyadmin" },
            { user: "onlyadmin5", pass: "onlyadmin5", role: "onlyadmin" }
        ];

        // ===================== HÀM HỖ TRỢ =====================
        function getDeviceId() {
            let id = localStorage.getItem("device_id");
            if (!id) {
                id = "dev_" + Math.random().toString(36).substr(2, 12) + Date.now();
                localStorage.setItem("device_id", id);
            }
            return id;
        }

        function checkDeviceLock(username) {
            const key = "lock_" + username;
            const lockedDevice = localStorage.getItem(key);
            const currentDevice = getDeviceId();

            if (!lockedDevice) {
                // Lần đầu đăng nhập → khóa thiết bị này
                localStorage.setItem(key, currentDevice);
                return true;
            }
            return lockedDevice === currentDevice;
        }

        // ===================== ĐĂNG NHẬP =====================
        function handleLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            const account = accounts.find(a => a.user === user && a.pass === pass);

            if (!account) {
                errorMsg.style.display = "block";
                errorMsg.innerText = "Sai tài khoản hoặc mật khẩu!";
                return;
            }

            // Kiểm tra giới hạn thiết bị (Admin & Only Admin)
            if (account.role === "admin" || account.role === "onlyadmin") {
                if (!checkDeviceLock(account.user)) {
                    errorMsg.style.display = "block";
                    errorMsg.innerText = "Tài khoản này đã được đăng nhập trên thiết bị khác!";
                    return;
                }
            }

            // Đăng nhập thành công
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("currentUser", account.user);
            localStorage.setItem("currentRole", account.role);

            showMainApp(account.role);
        }

        function showMainApp(role) {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("mainHeader").style.display = "flex";
            document.getElementById("mainContent").style.display = "block";

            const badge = document.getElementById("roleBadge");
            badge.style.display = "inline-block";

            if (role === "free") {
                badge.innerText = "Free";
                badge.className = "role-badge role-free";
            } else if (role === "admin") {
                badge.innerText = "Admin";
                badge.className = "role-badge role-admin";
            } else if (role === "onlyadmin") {
                badge.innerText = "Only Admin";
                badge.className = "role-badge role-onlyadmin";
            }
        }

        function logout() {
            localStorage.removeItem("loggedIn");
            localStorage.removeItem("currentUser");
            localStorage.removeItem("currentRole");
            location.reload();
        }

        // ===================== KIỂM TRA ĐÃ ĐĂNG NHẬP CHƯA =====================
        window.onload = function () {
            if (localStorage.getItem("loggedIn") === "true") {
                const role = localStorage.getItem("currentRole");
                showMainApp(role);
            }
        };

        // ===================== CHỨC NĂNG CŨ =====================
        const homePage = document.getElementById('homePage');
        const contentFrame = document.getElementById('content-frame');
        const backBtn = document.getElementById('backBtn');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        hamburgerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('show');
        });

        document.addEventListener('click', () => {
            dropdownMenu.classList.remove('show');
        });

        function loadPage(url, title) {
            dropdownMenu.classList.remove('show');
            homePage.style.display = 'none';
            contentFrame.style.display = 'block';
            contentFrame.src = url;
            backBtn.style.display = 'block';
            document.title = title + ' | PRO PROJECT';
        }

        function goHome() {
            contentFrame.style.display = 'none';
            contentFrame.src = '';
            homePage.style.display = 'block';
            backBtn.style.display = 'none';
            document.title = 'PRO PROJECT';
        }

        // Enter để đăng nhập
        document.getElementById("password").addEventListener("keypress", function(e) {
            if (e.key === "Enter") handleLogin();
        });
    </script>
</body>
</html>
